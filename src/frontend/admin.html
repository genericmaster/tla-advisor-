<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLA Advisor — Admin</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/admin.css">
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>TLA ADMIN</span>
            <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">✕</button>
        </div>
        <nav class="sidebar-nav">
            <button class="logout-btn" id="logoutBtn">Log out</button>
            <p class="sidebar-section-label">Review</p>
            <ul class="admin-nav-list">
                <li class="admin-nav-item admin-nav-item--active" id="navCorrections" style="cursor:pointer">
                    Pending Corrections
                    <span class="admin-nav-count" id="pendingCount">0</span>
                </li>
                <li class="admin-nav-item" id="navDocuments" style="cursor:pointer">
                    Documents
                </li>
            </ul>
        </nav>
    </aside>

    <div class="admin-panel">

        <header class="admin-header">
            <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
            <h1 class="admin-title" id="adminTitle">Pending Corrections</h1>
            <button class="admin-refresh-btn" id="refreshBtn" aria-label="Refresh">↻</button>
        </header>

        <!-- Corrections section -->
        <main class="admin-queue" id="queueSection">
            <div class="admin-empty-state" id="emptyState">
                <p>Nothing waiting on you right now.</p>
                <p class="admin-empty-hint">Approved corrections will appear here for review before joining the corpus.</p>
            </div>
        </main>

        <!-- Documents section -->
        <main class="admin-queue hidden" id="documentsSection">
            <div class="doc-upload-area">
                <label class="doc-upload-label" for="fileInput">Upload a document</label>
                <p class="doc-upload-hint">Supported: PDF, TXT</p>
                <input type="file" id="fileInput" accept=".pdf,.txt" style="display:none">
                <button class="correction-action-btn correction-action-btn--approve" id="uploadBtn">Choose file</button>
                <span id="uploadStatus" class="doc-upload-status"></span>
            </div>

            <div class="doc-list-area">
                <p class="sidebar-section-label" style="margin-bottom:12px">Ingested documents</p>
                <ul class="doc-list" id="docList">
                    <li class="admin-empty-state" style="margin-top:0">Loading...</li>
                </ul>
            </div>
        </main>

    </div>

    <script src="/admin.js"></script>
</body>
</html>
